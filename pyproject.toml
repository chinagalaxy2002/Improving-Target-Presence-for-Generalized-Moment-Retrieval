[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soccergmr-geq"
version = "0.1.0"
description = "SoccerGMR 11-backbone query-conditioned clip supervision and GEQ+aux"
requires-python = ">=3.10"
dependencies = ["torch==2.5.1", "torchvision==0.20.1", "numpy>=1.26,<3", "scipy>=1.13,<2", "scikit-learn>=1.5,<2", "pandas>=2,<3", "tqdm>=4.66,<5", "PyYAML>=6,<7", "easydict>=1.13,<2", "einops>=0.7,<1"]

[project.optional-dependencies]
report = ["matplotlib>=3.8,<4", "Pillow>=10"]
test = ["pytest>=8,<9"]

[project.scripts]
soccergmr = "soccergmr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*vendor*"]

[tool.setuptools.package-data]
"soccergmr.backbones" = ["vendor/**/*.py", "vendor/**/LICENSE", "vendor/**/LICENSE.md", "SOURCE_MANIFEST.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
